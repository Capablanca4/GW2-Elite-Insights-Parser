<template>
    <div>
        <div class="d-flex flex-row justify-content-center mt-1" id="phase-nav">
            <phase-component :phases="reactiveLogdata.phases"></phase-component>
        </div>
        <div class="d-flex flex-row justify-content-center mb-2 mt-2" id="actors">
            <div v-if="hasTargets && showTarget" class="d-flex flex-row justify-content-center align-items-center flex-wrap mr-5">
                <target-component :targets="reactiveLogdata.targets" :phaseindex="activePhaseIndex" />
            </div>
            <div class="ml-5">
                <player-component :players="reactiveLogdata.players" :phaseindex="activePhaseIndex" />
            </div>
        </div>

        <nav-tabs-component @tab-change="onTabChange">
            <stat-tables-component :label="'General Stats'" 
                :phaseindex="activePhaseIndex" :playerindex="activePlayerIndex" :activetargets="activePhaseTargets" />
            <buff-tab-component :label="'Buffs'" 
                :phaseindex="activePhaseIndex" :playerindex="activePlayerIndex" />
            <dmgmodifier-stats-container-component :label="'Damage Modifiers'" 
                :phaseindex="activePhaseIndex" :playerindex="activePlayerIndex" :activetargets="activePhaseTargets" />
            <mechanics-stats-component :label="'Mechanics'" 
                :phaseindex="activePhaseIndex" :playerindex="activePlayerIndex" />
            <graph-stats-component :label="'Graph'" 
                :phaseindex="activePhaseIndex" :playerindex="activePlayerIndex" :activetargets="activePhaseTargets" :light="light" />
            <player-rotations-tab-component :label="'Rotations'" 
                :phaseindex="activePhaseIndex" :playerindex="activePlayerIndex" :light="light" />
            <target-stats-component :label="'Targets Summary'" 
                 :phaseindex="activePhaseIndex" :playerindex="activePlayerIndex" :simplephase="reactiveLogdata.phases[activePhaseIndex]" :light="light" />
            <player-stats-component :label="'Player Summary'"
                :phaseindex="activePhaseIndex" :activeplayer="activePlayerIndex" :activetargets="activePhaseTargets" :light="light" />
        </nav-tabs-component>
    </div>
</template>

<script>

    function getDefaultMainSubComponent() {
        if (!validateStartPath("Statistics")) {
            return 0;
        }
        const setting = EIUrlParams.get("startPage");
        const compo = setting.split('/')[1];
        switch (compo) {
            case "GeneralStats":
                return 0;
            case "Buffs":
                return 1;
            case "DamageModifiers":
                return hasDamageMods() ? 2 : 0;
            case "Mechanics":
                return hasMechanics() ? 3 : 0;
            case "Graph":
                return 4;
            case "Rotations":
                return hasRotations() ? 7 : 0;
            case "TargetsSummary":
                return hasTargets() ? 5 : 0;
            case "PlayerSummary":
                return 6;
        }
        return 0;
    }
    Vue.component("main-view-component", {
        props: ['light'],
        template: `${template}`,
        data: function () {
            return {
                tab: getDefaultMainSubComponent(),
                reactiveLogdata: reactiveLogdata,
                showTarget: true
            };
        },
        computed: {
            activePhaseIndex: function () {
                return this.reactiveLogdata.phases.findIndex(p => p.active);
            },
            activePlayerIndex: function () {
                return this.reactiveLogdata.players.findIndex(p => p.active);
            },
            activePhaseTargets: function () {
                var res = [];
                const activePhase = logData.phases[this.activePhaseIndex];
                for (var i = 0; i < activePhase.targets.length; i++) {
                    const targetIndex = activePhase.targets[i];
                    const target = this.reactiveLogdata.targets[targetIndex][this.activePhaseIndex];
                    if (target.active) {
                        res.push(i);
                    }
                }
                return res;
            }
        },
        methods: {
            onTabChange: function ({ label }) {
                this.showTarget = label !== "Targets Summary";
            }
        }
    });
</script>
